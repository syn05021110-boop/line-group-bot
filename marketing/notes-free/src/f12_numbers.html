<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:760px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:48px'>脳のエネルギー、<span class='y'>本当の数字</span></div>
      <div style='display:flex;gap:40px;margin-top:34px;align-items:flex-start'>
        <div style='flex:1;display:flex;flex-direction:column;gap:14px'>
          <div style='font-size:30px;font-weight:900;align-self:center;padding:8px 24px;border:2px solid #6F7C96;border-radius:6px;color:#9AA7BF'>話してきたこと</div>
          <div class='card' style='padding:20px 24px;font-size:30px;font-weight:800;line-height:1.4;color:#9AA7BF'><span style='text-decoration:line-through;text-decoration-color:#E5484D;text-decoration-thickness:4px'>1〜2%しか働いていない</span></div><div class='card' style='padding:20px 24px;font-size:30px;font-weight:800;line-height:1.4;color:#9AA7BF'><span style='text-decoration:line-through;text-decoration-color:#E5484D;text-decoration-thickness:4px'>100%で原子力発電所2つ分</span></div>
          <div style='font-size:26px;font-weight:800;color:#E5484D;text-align:center;margin-top:6px'>✕ 事実ではない。映画の話だった</div>
        </div>
        <div style='align-self:center;font-size:52px;color:#FFD23F;font-weight:900'>→</div>
        <div style='flex:1;display:flex;flex-direction:column;gap:14px'>
          <div class='tag' style='font-size:30px;align-self:center;padding:8px 24px'>本当の数字</div>
          <div class='card' style='padding:16px 24px;border:2px solid #FFD23F;background:#2A2A1E'><div class='m' style='font-size:22px;font-weight:800'>重さ</div><div class='y' style='font-size:34px;font-weight:900;margin-top:4px'>体重の約2%</div></div><div class='card' style='padding:16px 24px;border:2px solid #FFD23F;background:#2A2A1E'><div class='m' style='font-size:22px;font-weight:800'>エネルギー</div><div class='y' style='font-size:34px;font-weight:900;margin-top:4px'>全身の約2割</div></div><div class='card' style='padding:16px 24px;border:2px solid #FFD23F;background:#2A2A1E'><div class='m' style='font-size:22px;font-weight:800'>電力にすると</div><div class='y' style='font-size:34px;font-weight:900;margin-top:4px'>約20ワット</div></div>
        </div>
      </div>
      <div style='font-size:28px;font-weight:800;margin-top:28px;text-align:right'>だから、<span class='y'>省エネしたがる</span></div>
    </div></body></html>
