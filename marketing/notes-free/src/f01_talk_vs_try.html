<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:650px;overflow:hidden}

</style></head><body><div class='grid-bg'></div><div class='pad'>

    </div></body></html>
