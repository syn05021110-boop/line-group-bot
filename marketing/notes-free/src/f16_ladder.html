<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:620px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:48px'>大きい目標を<span class='y'>3段</span>に分ける</div>
      <div style='display:flex;flex-direction:column;gap:18px;margin-top:36px'><div class='card' style='margin-left:400px;width:752px;padding:22px 28px;display:flex;align-items:center;gap:24px;'><div class='tag' style='font-size:26px;align-self:center;flex:none;width:190px;text-align:center;white-space:nowrap'>大きい目標</div><div style='font-size:30px;font-weight:800;line-height:1.45;'>脱サラ（夢）</div></div><div class='card' style='margin-left:200px;width:752px;padding:22px 28px;display:flex;align-items:center;gap:24px;'><div class='tag' style='font-size:26px;align-self:center;flex:none;width:190px;text-align:center;white-space:nowrap'>小さい目標</div><div style='font-size:30px;font-weight:800;line-height:1.45;'>例：最初の1円／発信を続ける／<br>強みを説明できる形に</div></div><div class='card' style='margin-left:0px;width:752px;padding:22px 28px;display:flex;align-items:center;gap:24px;border:2px solid #FFD23F;background:#2A2A1E'><div class='tag' style='font-size:26px;align-self:center;flex:none;width:190px;text-align:center;white-space:nowrap'>行動</div><div style='font-size:30px;font-weight:800;line-height:1.45;color:#FFD23F'>例：休憩の5分で下書き1本</div></div></div>
      <div class='m' style='font-size:23px;font-weight:700;margin-top:auto;text-align:right'>※小さい目標・行動は例</div>
    </div></body></html>
