<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:700px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:50px'>お客さん目線で<span class='y'>直した7つ</span></div>
      <div style='display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px'><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>1</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>期限なしのキーに入れ替え</div></div><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>2</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>エラーの見せ方を変えた</div></div><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>3</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>待ち時間を表示</div></div><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>4</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>何問目かを表示</div></div><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>5</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>言っていないことを足さない</div></div><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>6</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>特商法・解約ページを作った</div></div><div class='card' style='padding:24px 28px;display:flex;align-items:center;gap:22px'><div class='num' style='font-size:44px;width:36px;line-height:1'>7</div><div style='font-size:31px;font-weight:800;white-space:nowrap'>LINEの連絡先を統一</div></div>
        <div class='card' style='padding:24px 28px;display:flex;align-items:center;border-color:#FFD23F'>
          <div style='font-size:28px;font-weight:800;line-height:1.45'>最初から触っていれば<br><span class='y'>すぐ気づけたこと</span>ばかり</div></div>
      </div>
    </div></body></html>
