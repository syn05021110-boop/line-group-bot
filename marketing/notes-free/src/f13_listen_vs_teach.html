<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:48px'>聞き方を<span class='y'>変える</span></div>
      <div style='display:flex;gap:40px;margin-top:34px;align-items:flex-start'><div style='flex:1;display:flex;flex-direction:column;gap:14px'><div style='font-size:30px;font-weight:900;align-self:center;padding:8px 24px;border:2px solid #6F7C96;border-radius:6px;color:#9AA7BF'>ただ聞く</div><div class='card' style='padding:18px 24px;font-size:30px;font-weight:800;line-height:1.4;'>受け取るだけ</div></div>
        <div style='align-self:center;font-size:52px;color:#FFD23F;font-weight:900'>→</div><div style='flex:1;display:flex;flex-direction:column;gap:14px'><div class='tag' style='font-size:30px;align-self:center;padding:8px 24px'>教えるつもりで聞く</div><div class='card' style='padding:18px 24px;font-size:30px;font-weight:800;line-height:1.4;'>「一言で言うと？」をメモ</div><div class='card' style='padding:18px 24px;font-size:30px;font-weight:800;line-height:1.4;'>3行で説明してみる</div><div class='card' style='padding:18px 24px;font-size:30px;font-weight:800;line-height:1.4;border:2px solid #FFD23F;background:#2A2A1E;color:#FFD23F'>投稿の下書きへ</div></div></div>
      <div class='m' style='font-size:25px;font-weight:700;margin-top:32px;text-align:right'>
        数字（<span style='text-decoration:line-through;text-decoration-color:#E5484D;text-decoration-thickness:4px'>5%・95%</span>）は根拠不明。考え方には研究あり</div>
    </div></body></html>
