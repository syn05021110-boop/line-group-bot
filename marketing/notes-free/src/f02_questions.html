<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:740px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:50px'>始める前に<span class='y'>自分に聞く6つ</span></div>
      <div style='display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:36px'><div class='card' style='padding:26px 30px;display:flex;align-items:center;gap:24px'><div class='num' style='font-size:52px;width:44px;line-height:1'>1</div><div style='font-size:32px;font-weight:800;line-height:1.35'>自分の時間の形に<br>合っているか</div></div><div class='card' style='padding:26px 30px;display:flex;align-items:center;gap:24px'><div class='num' style='font-size:52px;width:44px;line-height:1'>2</div><div style='font-size:32px;font-weight:800;line-height:1.35'>結果までの「待ち」に<br>耐えられるか</div></div><div class='card' style='padding:26px 30px;display:flex;align-items:center;gap:24px'><div class='num' style='font-size:52px;width:44px;line-height:1'>3</div><div style='font-size:32px;font-weight:800;line-height:1.35'>仕組みの壁を<br>先に調べたか</div></div><div class='card' style='padding:26px 30px;display:flex;align-items:center;gap:24px'><div class='num' style='font-size:52px;width:44px;line-height:1'>4</div><div style='font-size:32px;font-weight:800;line-height:1.35'>真似できる人が<br>近くにいるか</div></div><div class='card' style='padding:26px 30px;display:flex;align-items:center;gap:24px'><div class='num' style='font-size:52px;width:44px;line-height:1'>5</div><div style='font-size:32px;font-weight:800;line-height:1.35'>生活を崩さずに<br>続けられる金額か</div></div><div class='card' style='padding:26px 30px;display:flex;align-items:center;gap:24px'><div class='num' style='font-size:52px;width:44px;line-height:1'>6</div><div style='font-size:32px;font-weight:800;line-height:1.35'>合わないと分かったら<br>やめられるか</div></div></div>
      <div class='m' style='font-size:26px;font-weight:700;margin-top:28px;text-align:right'>※ 私の経験からの考えです</div>
    </div></body></html>
