<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:690px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:48px'>時間を決めるのを<span class='y'>やめたら続いた</span></div>
      <div style='display:flex;gap:28px;margin-top:40px;align-items:stretch'>
        <div class='card' style='flex:1;padding:34px 36px;;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px'><div class='m' style='font-size:36px;font-weight:900'>before</div><div style='height:4px'></div><div style='font-size:32px;font-weight:800;line-height:1.35'>帰宅後1〜2時間と決める</div><div style='font-size:26px;color:#FFD23F;line-height:1'>▼</div><div style='font-size:32px;font-weight:800;line-height:1.35'>疲れてできない</div><div style='font-size:26px;color:#FFD23F;line-height:1'>▼</div><div style='font-size:32px;font-weight:800;line-height:1.35'>落ち込む</div></div>
        <div class='card' style='flex:1;padding:34px 36px;border:2px solid #FFD23F;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px'><div class='y' style='font-size:36px;font-weight:900'>after</div><div style='height:4px'></div><div style='font-size:32px;font-weight:800;line-height:1.35'>休憩の5分・10分<br>時間は決めない</div><div style='font-size:26px;color:#FFD23F;line-height:1'>▼</div><div style='font-size:32px;font-weight:800;line-height:1.35'>気持ちが楽</div><div style='font-size:26px;color:#FFD23F;line-height:1'>▼</div><div style='font-size:32px;font-weight:800;line-height:1.35'>続く</div></div>
      </div>
    </div></body></html>
