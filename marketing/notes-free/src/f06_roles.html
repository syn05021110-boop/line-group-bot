<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:590px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0E1525;color:#fff;
  -webkit-font-smoothing:antialiased;position:relative}
.y{color:#FFD23F}.m{color:#9AA7BF}
.pad{position:absolute;inset:0;padding:64px;display:flex;flex-direction:column}
.tag{display:inline-block;background:#FFD23F;color:#0E1525;font-weight:800;border-radius:6px;padding:6px 14px;align-self:flex-start}
.h{font-weight:800;line-height:1.28;letter-spacing:-0.01em}
.card{background:#18223A;border:1px solid #2B3858;border-radius:14px}
.num{font-weight:900;color:#FFD23F}
.foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;color:#6F7C96;font-weight:600}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
</style></head><body><div class='grid-bg'></div><div class='pad'>
      <div class='h' style='font-size:48px'>PTAの役割分担</div>
      <div style='display:flex;gap:24px;margin-top:44px;align-items:center'>
        <div class='card' style='flex:1;padding:36px 30px;text-align:center;'><div class='m' style='font-size:32px;font-weight:900'>役員のみなさん</div><div style='font-size:42px;font-weight:800;margin-top:18px;line-height:1.4'>案を出す<br>作業を進める</div></div><div style='display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 6px'><div class='tag' style='font-size:30px;align-self:center;padding:10px 22px'>感謝</div><div style='font-size:52px;color:#FFD23F;font-weight:900;line-height:1'>⇄</div><div class='tag' style='font-size:30px;align-self:center;padding:10px 22px'>巻き込む</div></div><div class='card' style='flex:1;padding:36px 30px;text-align:center;border:2px solid #FFD23F'><div class='y' style='font-size:32px;font-weight:900'>自分（会長）</div><div style='font-size:42px;font-weight:800;margin-top:18px;line-height:1.4'>人前で話す<br>決める</div></div>
      </div>
      <div style='font-size:30px;font-weight:700;margin-top:40px;text-align:center'>嫌がられる役を、<span class='y'>自分が先に引き受ける</span></div>
    </div></body></html>
