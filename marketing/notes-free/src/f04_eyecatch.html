<!doctype html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:670px;overflow:hidden}

.y{color:#FFD23F}.m{color:#9AA7BF}

      </div>
